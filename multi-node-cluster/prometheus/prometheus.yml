scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'kafka'
    scrape_interval: 10s
    honor_timestamps: true
    static_configs:
      - targets: [
        'kafka-1:15083',
        'kafka-2:25083',
        'kafka-3:35083'
      ]
        labels:
          env: "dev"
          kafka_cluster_id: "MkU3OEVBNTcwNTJENDM2Qk"
